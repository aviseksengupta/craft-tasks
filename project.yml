name: CraftTasksApple
options:
  bundleIdPrefix: com.avisek
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES

targets:
  CraftTasksiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/CraftTasks/Models.swift
        group: Shared
      - path: Sources/CraftTasks/Store.swift
        group: Shared
      - path: Sources/CraftTasks/SyncEngine.swift
        group: Shared
      - path: Sources/CraftTasks/Database.swift
        group: Shared
      - path: Sources/CraftTasks/AppLog.swift
        group: Shared
      - path: Sources/CraftTasks/Pomodoro.swift
        group: Shared
      - path: Sources/CraftTasks/GoogleCalendar.swift
        group: Shared
      - path: Sources/CraftTasksShared/PomodoroActivityAttributes.swift
        group: Shared
      - path: Sources/CraftTasksiOS
    info:
      path: Sources/CraftTasksiOS/Info.plist
      properties:
        CFBundleDisplayName: Craft Tasks
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false
        NSUserNotificationsUsageDescription: Craft Tasks uses notifications for pomodoro timer reminders.
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avisek.crafttasks
        PRODUCT_NAME: Craft Tasks
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        LIBRARY_SEARCH_PATHS: ["$(inherited)"]
        HEADER_SEARCH_PATHS: ["$(SDKROOT)/usr/include"]
        OTHER_LDFLAGS: ["-lsqlite3"]
    dependencies:
      - target: CraftTasksWatch
        embed: true
      - target: CraftTasksWidget
        embed: true
    scheme: {}

  CraftTasksWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/CraftTasksShared/PomodoroActivityAttributes.swift
        group: Shared
      - path: Sources/CraftTasksWidget
    info:
      path: Sources/CraftTasksWidget/Info.plist
      properties:
        CFBundleDisplayName: Craft Tasks Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avisek.crafttasks.widget
        PRODUCT_NAME: CraftTasksWidget
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: NO
    scheme: {}

  CraftTasksWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/CraftTasks/Models.swift
        group: Shared
      - path: Sources/CraftTasks/Store.swift
        group: Shared
      - path: Sources/CraftTasks/SyncEngine.swift
        group: Shared
      - path: Sources/CraftTasks/Database.swift
        group: Shared
      - path: Sources/CraftTasks/AppLog.swift
        group: Shared
      - path: Sources/CraftTasks/Pomodoro.swift
        group: Shared
      - path: Sources/CraftTasksWatch
    info:
      path: Sources/CraftTasksWatch/Info.plist
      properties:
        CFBundleDisplayName: Craft Tasks
        UILaunchScreen: {}
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.avisek.crafttasks
        NSUserNotificationsUsageDescription: Craft Tasks uses notifications for pomodoro timer reminders.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avisek.crafttasks.watchkitapp
        PRODUCT_NAME: Craft Tasks
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO
        LIBRARY_SEARCH_PATHS: ["$(inherited)"]
        HEADER_SEARCH_PATHS: ["$(SDKROOT)/usr/include"]
        OTHER_LDFLAGS: ["-lsqlite3"]
    scheme: {}
